name: Refresh upload index

on:
  schedule:
    # every 5 minutes between 09:00 and 19:59 BDT (03:00-13:59 UTC) on 1 August
    - cron: "*/5 3-13 1 8 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-upload-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index from the Nextcloud share
        id: build
        continue-on-error: true
        run: python3 tools/build_upload_index.py

      - name: Commit & push if the index changed
        if: steps.build.outcome == 'success'
        run: |
          if git diff --quiet js/uploads-index.js; then
            echo "Index unchanged - nothing to publish."
          else
            git config user.name "upload-index-bot"
            git config user.email "actions@users.noreply.github.com"
            git add js/uploads-index.js
            git commit -m "Refresh upload index"
            git push
          fi
